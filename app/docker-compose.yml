services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: todos
      DB_USER: todo_app
      DB_PASSWORD: localdevpassword
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: todos
      POSTGRES_USER: todo_app
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_app -d todos"]
      interval: 5s
      timeout: 5s
      retries: 5
