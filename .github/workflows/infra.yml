name: Terraform Infra

on:
  pull_request:
    paths:
      - "environments/dev/**"
      - "modules/**"
      - "global/**"
      - ".github/workflows/infra.yml"
  push:
    branches:
      - main
    paths:
      - "environments/dev/**"
      - "global/**"
      - "modules/**"
      - ".github/workflows/infra.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::950153069253:role/github-oidc-deploy-role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Cache TFLint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('**/.tflint.hcl') }}

      - name: Initialize TFLint
        run: tflint --init

      - name: Terraform Init
        run: >-
          terraform init
          -backend-config="bucket=tanay-tf-state-phase-one"
          -backend-config="key=dev/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="dynamodb_table=terraform-locks"
          -backend-config="encrypt=true"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: TFLint
        run: tflint --recursive

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: environments/dev

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Show plan
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: environments/dev/tfplan

      - name: Comment plan on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/dev/tfplan.txt', 'utf8');
            const body = [
              'Terraform plan for `environments/dev`',
              '',
              '```text',
              plan.length > 60000 ? plan.slice(0, 60000) + '\n... plan truncated ...' : plan,
              '```',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  apply:
    name: apply
    needs: plan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::950153069253:role/github-oidc-deploy-role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: environments/dev

      - name: Terraform Init
        run: >-
          terraform init
          -backend-config="bucket=tanay-tf-state-phase-one"
          -backend-config="key=dev/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="dynamodb_table=terraform-locks"
          -backend-config="encrypt=true"

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan